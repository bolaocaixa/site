<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BR Carregadores</title>
  <meta name="description" content="Carregadores originais e cabos de carregamento ultrarrápido com ofertas por tempo limitado.">
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="stylesheet" href="css/slots.css">
  <link rel="stylesheet" href="css/contagem.css">
  <link rel="stylesheet" href="css/loja.css">
  <link rel="stylesheet" href="css/responsivo.css">
</head>
<body>
  <div id="cab-loja"></div>
  <div id="topo-site"></div>
  <div class="slot-navbar" id="slot-navbar" hidden></div>

  <div class="layout-site" id="layout-site">
    <aside class="lado esq" id="slot-resultados" aria-label="Publicidade" hidden></aside>
    <div id="app"><p class="carregando">Carregando…</p></div>
    <aside class="lado dir" id="slot-lateral" aria-label="Publicidade" hidden></aside>
  </div>

  <footer class="slot-rodape" id="slot-rodape" hidden></footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/imagens.js"></script>
  <script src="js/carrossel.js"></script>
  <script src="js/slots.js"></script>
  <script src="js/slots-extra.js"></script>
  <script src="js/contagem.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/pedido.js"></script>
  <script src="js/loja.js"></script>
</body>
</html>
